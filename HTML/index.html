<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ViajesStan</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../CSS/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body>

<nav 

  class="navbar navbar-expand-lg navbar-dark bg-primary">

  <div class="container">

    <a class="navbar-brand fw-bold" href="#">
      <i class="bi bi-airplane-engines-fill"></i>
      ViajesStan
    </a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarViajesStan"
      aria-controls="navbarViajesStan"
      aria-expanded="false"
      aria-label="Toggle navigation">

      <span class="navbar-toggler-icon"></span>

    </button>

    <div class="collapse navbar-collapse" id="navbarViajesStan">

      <ul class="navbar-nav ms-auto">

        <li class="nav-item">
          <a class="nav-link" href="#catalogo">
            <i class="bi bi-geo-alt-fill"></i>
            Destinos
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="#carrito-section">
            <i class="bi bi-suitcase-lg-fill"></i>
            Mi Maleta
          </a>
        </li>

      </ul>

    </div>

  </div>

</nav>

<header class="hero text-center text-white">

    <h1> ✈️ ViajesStan</h1>
    <p>Encuentra tu próxima aventura</p>

</header>

<main class="container my-5">

    <section>
      <h2 class="text-center mb-5">
        <i class="bi bi-geo-alt-fill"></i>
        Destinos disponibles
      </h2>

      <div id="catalogo" class="row g-4"></div>

    </section>

    <section class="mt-5" id="carrito-section">

    <div class="card shadow p-4">

      <h2 class="text-center mb-4">
        Carrito de Viajes
        (<span id="cantidad-productos">0</span>)
      </h2>

      <ul id="carrito" class="list-group mb-3"></ul>

      <h4 class="text-center">
        Total: $
        <span id="total">0</span>
      </h4>

    </div>

    <div class="text-center mt-3">
      <button
        id="vaciar-carrito"
        class="btn btn-outline-danger">
        Vaciar Maleta 🧳 
      </button>
    </div>

    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../JS/app.js"></script>

<footer class="bg-dark text-white text-center py-3">

  <p class="mb-0">
    © 2026 ViajesStan | Tu próxima aventura comienza aquí |
    Generation Colombia. CH15 | Mi Primer Hackathon --
    Realizado por: Kendry Y. Vargas Gaviria
  </p>

</footer>

</body>

</html>
